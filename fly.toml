# Fly.io 設定檔
# 如果 'linku-rps' 這個名字被搶走了，改成你想要的（會反映成 <app>.fly.dev）
app = "linku-rps"

# 香港最近台灣；要其他地區可以改：nrt (東京) / sin (新加坡) / sjc (美西) ...
primary_region = "hkg"

[build]
  # 使用同目錄下的 Dockerfile
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # 上線時把這行的 rps.linku.tech 留著；本機測試 fly 機器用得到 localhost
  ALLOWED_ORIGINS = "https://rps.linku.tech,http://localhost:3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  # 健康檢查
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# 最小機規格（256MB 夠這個遊戲跑）
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
